name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Validate production Compose configuration
        env:
          APP_ORIGIN: http://127.0.0.1:4310
        run: docker compose config --quiet
      - name: Build production image
        run: docker build -t lab-planning-ci .
      - name: Validate direct intranet Compose configuration
        run: docker compose --env-file deploy/intranet.env.example -f compose.intranet.yaml config --quiet
      - name: Start isolated production service
        run: >-
          docker run -d --name lab-planning-ci
          -p 127.0.0.1:4321:4310
          -v lab-planning-ci-data:/app/data
          -e APP_ORIGIN=http://127.0.0.1:4321
          -e COOKIE_SECURE=false
          lab-planning-ci
      - run: node tests/deployment-smoke.mjs setup
      - name: Verify online backup and persistent restart
        run: |
          docker exec lab-planning-ci npm run backup -- /app/data/backups/container-check.sqlite
          docker restart lab-planning-ci
          node tests/deployment-smoke.mjs verify
      - name: Container diagnostics
        if: failure()
        run: docker logs lab-planning-ci
